<!DOCTYPE html>
<html>
<head>
    <title>AWS Costs</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .controls { margin: 20px 0; }
        .controls label { margin-right: 10px; }
        .controls input, .controls button { padding: 8px; margin-right: 10px; }
        .summary { display: flex; gap: 20px; margin: 20px 0; }
        .summary-card { flex: 1; padding: 20px; background: #f5f5f5; border-radius: 8px; }
        .summary-card h3 { margin: 0 0 10px 0; color: #666; font-size: 14px; }
        .summary-card .amount { font-size: 32px; font-weight: bold; color: #2196F3; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        .loading { color: #666; font-style: italic; }
    </style>
</head>
<body>
    <h1>AWS Cost Explorer</h1>
    <p><a href="/">← Back to Backstage</a></p>
    
    <div class="controls">
        <label>Start Date:</label>
        <input type="date" id="startDate" />
        <label>End Date:</label>
        <input type="date" id="endDate" />
        <button onclick="loadCosts()">Load Costs</button>
    </div>
    
    <div id="costs-loading" class="loading" style="display:none;">Loading...</div>
    
    <div class="summary" id="summary" style="display:none;">
        <div class="summary-card">
            <h3>TOTAL COST</h3>
            <div class="amount" id="totalCost">$0.00</div>
        </div>
        <div class="summary-card">
            <h3>PERIOD</h3>
            <div class="amount" id="period" style="font-size: 18px;">-</div>
        </div>
    </div>
    
    <div id="costs-content"></div>
    
    <script>
        // Set default dates (current month)
        const now = new Date();
        const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
        const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
        
        document.getElementById('startDate').valueAsDate = firstDay;
        document.getElementById('endDate').valueAsDate = lastDay;
        
        async function loadCosts() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            if (!startDate || !endDate) {
                alert('Please select both start and end dates');
                return;
            }
            
            document.getElementById('costs-loading').style.display = 'block';
            document.getElementById('summary').style.display = 'none';
            document.getElementById('costs-content').innerHTML = '';
            
            try {
                const response = await fetch(`/api/aws-costs?startDate=${startDate}&endDate=${endDate}`);
                const data = await response.json();
                document.getElementById('costs-loading').style.display = 'none';
                
                if (data.total !== undefined) {
                    document.getElementById('totalCost').textContent = `$${data.total.toFixed(2)}`;
                    document.getElementById('period').textContent = `${startDate} to ${endDate}`;
                    document.getElementById('summary').style.display = 'flex';
                    
                    if (data.byService && Object.keys(data.byService).length > 0) {
                        let html = '<h2>Cost by Service</h2>';
                        html += '<table><tr><th>Service</th><th>Cost (USD)</th><th>Percentage</th></tr>';
                        
                        const sortedServices = Object.entries(data.byService)
                            .sort((a, b) => b[1] - a[1]);
                        
                        sortedServices.forEach(([service, cost]) => {
                            const percentage = ((cost / data.total) * 100).toFixed(1);
                            html += `<tr>
                                <td>${service}</td>
                                <td>$${cost.toFixed(2)}</td>
                                <td>${percentage}%</td>
                            </tr>`;
                        });
                        html += '</table>';
                        document.getElementById('costs-content').innerHTML = html;
                    } else {
                        document.getElementById('costs-content').innerHTML = '<p>No cost data available for this period</p>';
                    }
                } else {
                    document.getElementById('costs-content').innerHTML = '<p>No cost data available</p>';
                }
            } catch (error) {
                document.getElementById('costs-loading').style.display = 'none';
                document.getElementById('costs-content').innerHTML = 'Error loading costs: ' + error.message;
            }
        }
        
        // Load costs on page load
        loadCosts();
    </script>
</body>
</html>
