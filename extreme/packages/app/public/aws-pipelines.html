<!DOCTYPE html>
<html>
<head>
    <title>AWS Pipelines</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #2196F3; color: white; }
        button { padding: 5px 10px; margin: 2px; cursor: pointer; }
        .loading { color: #666; font-style: italic; }
        .details { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 4px; }
        pre { background: #fff; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>AWS CodePipeline</h1>
    <p><a href="/">← Back to Backstage</a></p>
    
    <h2>Pipelines</h2>
    <div id="pipelines-loading" class="loading">Loading...</div>
    <div id="pipelines-content"></div>
    
    <div id="pipeline-details" class="details" style="display:none;">
        <h3>Pipeline Details</h3>
        <div id="details-content"></div>
    </div>
    
    <script>
        async function loadPipelines() {
            try {
                const response = await fetch('/api/aws-pipelines/pipelines');
                const pipelines = await response.json();
                document.getElementById('pipelines-loading').style.display = 'none';
                
                if (pipelines && pipelines.length > 0) {
                    let html = '<table><tr><th>Name</th><th>Created</th><th>Updated</th><th>Actions</th></tr>';
                    pipelines.forEach(pipeline => {
                        const created = new Date(pipeline.created).toLocaleString();
                        const updated = new Date(pipeline.updated).toLocaleString();
                        html += `<tr>
                            <td>${pipeline.name}</td>
                            <td>${created}</td>
                            <td>${updated}</td>
                            <td>
                                <button onclick="executePipeline('${pipeline.name}')">Execute</button>
                                <button onclick="viewDetails('${pipeline.name}')">Details</button>
                            </td>
                        </tr>`;
                    });
                    html += '</table>';
                    document.getElementById('pipelines-content').innerHTML = html;
                } else {
                    document.getElementById('pipelines-content').innerHTML = '<p>No pipelines found</p>';
                }
            } catch (error) {
                document.getElementById('pipelines-loading').innerHTML = 'Error loading pipelines: ' + error.message;
            }
        }
        
        async function executePipeline(name) {
            if (confirm(`Are you sure you want to execute pipeline ${name}?`)) {
                try {
                    const response = await fetch(`/api/aws-pipelines/pipelines/${name}/execute`, { method: 'POST' });
                    const data = await response.json();
                    alert(data.message || 'Pipeline execution started successfully');
                    loadPipelines();
                } catch (error) {
                    alert('Error: ' + error.message);
                }
            }
        }
        
        async function viewDetails(name) {
            try {
                const response = await fetch(`/api/aws-pipelines/pipelines/${name}`);
                const data = await response.json();
                
                let html = `<h4>${name}</h4>`;
                html += `<p><strong>Status:</strong> ${data.status || 'N/A'}</p>`;
                
                if (data.stages && data.stages.length > 0) {
                    html += '<h5>Stages:</h5><ul>';
                    data.stages.forEach(stage => {
                        html += `<li><strong>${stage.stageName}:</strong> ${stage.latestExecution?.status || 'N/A'}</li>`;
                    });
                    html += '</ul>';
                }
                
                // Load executions
                const execResponse = await fetch(`/api/aws-pipelines/pipelines/${name}/executions?limit=5`);
                const executions = await execResponse.json();
                
                if (executions && executions.length > 0) {
                    html += '<h5>Recent Executions:</h5><ul>';
                    executions.forEach(exec => {
                        const time = new Date(exec.startTime).toLocaleString();
                        html += `<li>${time} - ${exec.status}</li>`;
                    });
                    html += '</ul>';
                }
                
                document.getElementById('details-content').innerHTML = html;
                document.getElementById('pipeline-details').style.display = 'block';
            } catch (error) {
                alert('Error loading details: ' + error.message);
            }
        }
        
        loadPipelines();
    </script>
</body>
</html>
